# Keyword -> tags mapping used by classify/classifier.py.
# Matched against tokenized filename + parent folder names, case-insensitive.
# Everything is a tag now, including each rule's own name (e.g. matching the
# "kick" rule adds a "kick" tag) -- a file can match multiple rules at once
# (a "Guitar Riff" gets both `guitar` and `melody`), there's no single
# exclusive "type" anymore. "loop"/"one-shot" are NOT listed as static tags
# here on purpose -- classify() derives those dynamically per-file (filename
# keyword > duration > these tags as a fallback hint), and a static tag here
# would sometimes contradict that (e.g. a "kick" found inside a real
# "Loops/" folder should tag "loop", not a hardcoded "one-shot").
#
# This is a starting point, not exhaustive — expected to be edited as
# real files reveal naming patterns this misses.

types:
  kick:
    keywords: [kick, bd, bassdrum, "kick drum"]
    tags: [drum]

  snare:
    keywords: [snare, sd, rimshot, rim-shot]
    tags: [drum]

  clap:
    keywords: [clap, claps]
    tags: [drum]

  hihat:
    keywords: [hihat, "hi-hat", "hi hat", hat, hh, cymbal, ride, crash]
    tags: [drum]

  tom:
    keywords: [tom, toms]
    tags: [drum]

  percussion:
    keywords: [perc, percussion, shaker, tambourine, conga, bongo, cowbell]
    tags: [drum]

  breakbeat:
    keywords: [break, breakbeat, "drum loop", drumloop, groove]
    tags: [drum]

  bass:
    keywords: [bass, bassline, sub, "808"]
    tags: [bass]

  guitar:
    # "riff"/"strum" deliberately not shared with melody's keywords below --
    # melody's "riff" should stay generic (a synth riff isn't a guitar).
    keywords: [guitar, gtr, "electric guitar", "acoustic guitar", "guitar riff", strum, strumming]
    tags: [melodic]

  piano:
    keywords: [piano, "grand piano", "upright piano", keys]
    tags: [melodic, keys]

  synth:
    keywords: [synth, lead, pluck, arp, arpeggio]
    tags: [melodic, synth]

  pad:
    keywords: [pad, pads, drone, texture, atmosphere]
    tags: [melodic, synth, ambient]

  chord:
    keywords: [chord, chords, progression]
    tags: [melodic]

  melody:
    keywords: [melody, melodic, riff, hook, topline]
    tags: [melodic]

  vocal:
    keywords: [vocal, vox, acapella, "vocal chop", vocalchop, choir]
    tags: [vocal]

  fx:
    keywords: [fx, riser, sweep, impact, downlifter, uplifter, transition, whoosh]
    tags: [fx]

  ambience:
    keywords: [ambience, ambient, field, foley]
    tags: [fx, ambient]
