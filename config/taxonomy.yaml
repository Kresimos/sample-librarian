# Keyword -> tags mapping used by classify/classifier.py.
# Matched against tokenized filename + parent folder names, case-insensitive.
# Everything is a tag now, including each rule's own name (e.g. matching the
# "kick" rule adds a "kick" tag) -- a file can match multiple rules at once
# (a "Guitar Riff" gets both `guitar` and `melody`), there's no single
# exclusive "type" anymore. Deliberately generous: related categories are
# split into their own entries (e.g. hihat/cymbal/rimshot are separate, not
# lumped together) so faceted search has more useful, specific chips to
# offer, and it's fine/expected for one file to pick up several tags.
#
# "loop"/"one-shot" are NOT listed as static tags here on purpose --
# classify() derives those dynamically per-file (filename keyword > duration
# > these tags as a fallback hint via classifier.py's leaning-tag sets), and
# a static tag here would sometimes contradict that.
#
# This is a starting point, not exhaustive — expected to be edited as
# real files reveal naming patterns this misses.

types:
  # --- Drums / percussion ---------------------------------------------

  kick:
    keywords: [kick, bd, bassdrum, "kick drum"]
    tags: [drum]

  snare:
    keywords: [snare, sd, rimshot, rim-shot]
    tags: [drum]

  rimshot:
    keywords: [rimshot, "rim shot", "rim click"]
    tags: [drum]

  clap:
    keywords: [clap, claps]
    tags: [drum]

  hihat:
    keywords: [hihat, "hi-hat", "hi hat", hat, hh]
    tags: [drum]

  cymbal:
    keywords: [cymbal, ride, crash, splash]
    tags: [drum]

  tom:
    keywords: [tom, toms]
    tags: [drum]

  percussion:
    keywords: [perc, percussion]
    tags: [drum]

  shaker:
    keywords: [shaker, shakers]
    tags: [drum, percussion]

  tambourine:
    keywords: [tambourine]
    tags: [drum, percussion]

  conga:
    keywords: [conga, congas]
    tags: [drum, percussion]

  bongo:
    keywords: [bongo, bongos]
    tags: [drum, percussion]

  cowbell:
    keywords: [cowbell]
    tags: [drum, percussion]

  clave:
    keywords: [clave, claves]
    tags: [drum, percussion]

  triangle:
    keywords: [triangle]
    tags: [drum, percussion]

  woodblock:
    keywords: [woodblock, "wood block"]
    tags: [drum, percussion]

  timbale:
    keywords: [timbale, timbales]
    tags: [drum, percussion]

  djembe:
    keywords: [djembe]
    tags: [drum, percussion]

  drumfill:
    keywords: [fill, fills, roll, rolls, buildup, "build up"]
    tags: [drum]

  breakbeat:
    keywords: [break, breakbeat, "drum loop", drumloop, groove]
    tags: [drum]

  drumkit:
    keywords: ["full kit", "drum kit", drumkit, "beat loop"]
    tags: [drum]

  "808":
    keywords: ["808", "eight-oh-eight"]
    tags: [bass, drum]

  # --- Bass -------------------------------------------------------------

  bass:
    keywords: [bass, bassline, "bass line"]
    tags: [bass]

  sub:
    keywords: [sub, subbass, "sub bass"]
    tags: [bass]

  reese:
    keywords: [reese]
    tags: [bass, synth]

  # --- Melodic / harmonic -------------------------------------------------

  guitar:
    # "riff"/"strum" deliberately not shared with melody's keywords below --
    # melody's "riff" should stay generic (a synth riff isn't a guitar).
    keywords: [guitar, gtr, "electric guitar", "acoustic guitar", "guitar riff", strum, strumming]
    tags: [melodic]

  piano:
    keywords: [piano, "grand piano", "upright piano", keys]
