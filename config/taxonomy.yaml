  lofi:
    keywords: [lofi, "lo-fi", "lo fi"]

  dubstep:
    keywords: [dubstep]

  trance:
    keywords: [trance]

  disco:
    keywords: [disco]

  funk:
    keywords: [funk, funky]

  hiphop:
    keywords: ["hip hop", "hip-hop", hiphop, rap]

  cinematic:
    keywords: [cinematic, trailer, epic]

  rock:
    keywords: [rock]

  metal:
    keywords: [metal]

  pop:
    keywords: [pop]

  reggae:
    keywords: [reggae]

  afrobeat:
    keywords: [afrobeat, afrobeats]

  latin:
