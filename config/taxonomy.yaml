# Keyword -> tags mapping used by classify/classifier.py.
# Matched against tokenized filename + parent folder names, case-insensitive.
# Everything is a tag now, including each rule's own name (e.g. matching the
# "kick" rule adds a "kick" tag) -- a file can match multiple rules at once
# (a "Guitar Riff" gets both `guitar` and `melody`), there's no single
# exclusive "type" anymore. Deliberately generous: related categories are
# split into their own entries (e.g. hihat/cymbal/rimshot are separate, not
# lumped together) so faceted search has more useful, specific chips to
# offer, and it's fine/expected for one file to pick up several tags.
#
# "loop"/"one-shot" are NOT listed as static tags here on purpose --
# classify() derives those dynamically per-file (filename keyword > duration
# > these tags as a fallback hint via classifier.py's leaning-tag sets), and
# a static tag here would sometimes contradict that.
#
# This is a starting point, not exhaustive — expected to be edited as
# real files reveal naming patterns this misses.

types:
  # --- Drums / percussion ---------------------------------------------

  kick:
    keywords: [kick, bd, bassdrum, "kick drum"]
    tags: [drum]

  snare:
    keywords: [snare, sd, rimshot, rim-shot]
    tags: [drum]

  rimshot:
    keywords: [rimshot, "rim shot", "rim click"]
    tags: [drum]

  clap:
