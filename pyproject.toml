[project]
name = "sample-librarian"
version = "0.1.0"
description = "Personal sample/loop library organizer and Logic Pro browser"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "mutagen>=1.47",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "wavinfo>=3.0",
]

[project.scripts]
samplelib = "sample_librarian.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
